name: Verify and publish Pages

'on':
  push:
    branches: [main, arena/01a0fe8a-gemsdoe26]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Scientific and website checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-10-02
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-train.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned scientific and test dependencies (CPU)
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Restore prior last-good metadata (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/feed-last-good
          key: source-feed-v1-main-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            source-feed-v1-main-
      - name: Refresh permitted metadata, never competition site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          if [ -f .cache/feed-last-good/source-feed.json ]; then cp .cache/feed-last-good/source-feed.json docs/data/source-feed.json; fi
          python scripts/refresh_source_feed.py
          mkdir -p .cache/feed-last-good
          cp docs/data/source-feed.json .cache/feed-last-good/source-feed.json
      - name: Save last-good state without committing to any branch
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/feed-last-good
          key: source-feed-v1-main-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Python and JavaScript unit/pathological tests
        run: |
          set -euo pipefail
          python -m pytest -q
          npm test
      - name: Independently verify real JavaScript TIFF bytes
        run: |
          set -euo pipefail
          node scripts/browser_export_check.mjs .cache/browser-export.tif
          python scripts/verify_browser_export.py .cache/browser-export.tif
      - name: Build, verify and stage only public files
        run: |
          set -euo pipefail
          python scripts/build_site.py
          python scripts/verify_site.py
          python scripts/stage_site.py
      - name: Chromium responsive, interactive and download checks
        run: |
          set -euo pipefail
          node scripts/browser_check.mjs
          python scripts/build_site.py
          python scripts/verify_site.py
          python scripts/stage_site.py
          python scripts/verify_site.py --root .cache/pages-site --output .cache/staged-site-checks.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verification-evidence-${{ github.run_id }}
          path: |
            evidence/site_checks.json
            evidence/browser_checks.json
            evidence/browser_export_checks.json
            docs/data/source-feed.json
            .cache/ui/*.png
          include-hidden-files: true
          retention-days: 14
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: .cache/pages-site

  deploy:
    name: Publish verified research site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Select GitHub Actions as the Pages publication source when allowed
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow --jq '{build_type,status,html_url}'
      - name: Deploy frozen research artifacts and timestamped metadata
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
